apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-api
  namespace: family-budget
spec:
  replicas: 1   # keep at 1 — SQLAlchemy pool + Postgres is fine, but the
                # /api/agent flow has no distributed locking; one replica
                # keeps things simple for a family-scale app
  selector:
    matchLabels: { app: budget-api }
  template:
    metadata:
      labels: { app: budget-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: budget-api
          image: family-budget/api:latest
          imagePullPolicy: IfNotPresent   # set to Never if loading images
                                            # straight into a local cluster
                                            # (kind load / k3s ctr import)
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: budget-secrets }
            - configMapRef: { name: budget-config }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: budget-api
  namespace: family-budget
spec:
  selector: { app: budget-api }
  ports:
    - port: 8000
      targetPort: 8000
---
# Browser-facing — family devices' JS (from the web UI) call the API
# directly, so it needs a LAN-reachable port too, not just cluster-internal
# DNS. Swap this for a MetalLB `type: LoadBalancer` Service later if you'd
# rather have a clean IP than a NodePort — see the README.
apiVersion: v1
kind: Service
metadata:
  name: budget-api-nodeport
  namespace: family-budget
spec:
  type: NodePort
  selector: { app: budget-api }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
