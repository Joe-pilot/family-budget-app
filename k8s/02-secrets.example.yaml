# Safe template only. Copy this file to 02-secrets.yaml and replace every
# placeholder. The destination is ignored by Git; never commit populated values.
apiVersion: v1
kind: Secret
metadata:
  name: budget-secrets
  namespace: family-budget
type: Opaque
stringData:
  POSTGRES_USER: "budget"
  POSTGRES_PASSWORD: "replace-with-a-strong-password"
  POSTGRES_DB: "budget"

  # Keep this password synchronized with POSTGRES_PASSWORD. URL-encode any
  # reserved characters used in the password.
  DATABASE_URL: "postgresql+psycopg2://budget:replace-with-a-strong-password@postgres:5432/budget"

  TELEGRAM_BOT_TOKEN: "replace-with-your-telegram-bot-token"

  # Comma-separated Telegram numeric user IDs.
  ALLOWED_TELEGRAM_USER_IDS: ""

  # Required shared secret for every financial API endpoint. Use a high-entropy value.
  API_KEY: "replace-with-a-long-random-api-key"
