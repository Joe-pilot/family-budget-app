# Fill in every CHANGE-ME below, then: kubectl apply -f 02-secrets.yaml
# Do not commit this file with real values — add it to .gitignore, or better,
# manage it with `kubectl create secret` / sealed-secrets / SOPS instead of
# a plain YAML file once you're past the "getting it working" stage.
apiVersion: v1
kind: Secret
metadata:
  name: budget-secrets
  namespace: family-budget
type: Opaque
stringData:
  POSTGRES_USER: "budget"
  POSTGRES_PASSWORD: "CHANGE-ME-strong-password"
  POSTGRES_DB: "budget"

  # Must match the three values above.
  DATABASE_URL: "postgresql+psycopg2://budget:CHANGE-ME-strong-password@postgres:5432/budget"

  # From @BotFather on Telegram.
  TELEGRAM_BOT_TOKEN: "CHANGE-ME"

  # Comma-separated Telegram numeric user IDs. Leave empty at first boot,
  # message the bot /whoami once it's running, then fill this in and
  # `kubectl rollout restart deployment/telegram-bot -n family-budget`.
  ALLOWED_TELEGRAM_USER_IDS: ""

  # Optional shared secret required on write endpoints (X-API-Key header).
  # Leave empty to disable — reasonable if OPNsense already keeps this
  # cluster off the WAN (see the networking discussion). Set a value here
  # AND in web's config (API_KEY below) AND telegram-bot picks it up
  # automatically from this same secret if you fill it in.
  API_KEY: ""
