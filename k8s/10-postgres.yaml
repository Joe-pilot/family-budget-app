apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: family-budget
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: family-budget
spec:
  replicas: 1
  strategy:
    type: Recreate   # a single PVC can't be mounted by two pods at once
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: budget-secrets }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata   # avoids "lost+found" issues on some CSI drivers
            - { name: postgres-run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""] }
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - { name: postgres-run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: family-budget
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
